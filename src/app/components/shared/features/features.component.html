<section class="features-section" scrollAnimation animationType="fadeInUp">
  <div class="container">
    <div class="section-header" scrollReveal [revealDelay]="100">
      <div class="section-badge">
        <i class="material-icons">featured_play_list</i>
        <span>Features</span>
      </div>
      <h2>{{ header }}</h2>
      <p>{{ subheader }}</p>
    </div>

    <div class="features-grid stagger-animation" staggerAnimation>
      @for (feature of features; track $index) {
      <div
        class="feature-card stagger-item scroll-enhanced-card"
        scrollAnimation
        animationType="fadeInUp"
        [animationDelay]="$index * 150"
      >
        <!-- Card Background Effects -->
        <div class="card-background">
          <div class="gradient-overlay"></div>
        </div>

        <!-- Card Content -->
        <div class="card-content">
          <div class="feature-header">
            <div class="category-icon">
              <i class="material-icons">cloud</i>
              <div class="icon-ripple"></div>
              <div class="icon-glow"></div>
            </div>

            <div class="category-badge">
              <span>{{ feature.category }}</span>
            </div>
          </div>

          <div class="feature-content">
            <h3>{{ feature.category }}</h3>

            <div class="feature-items">
              @for (item of feature.items; track $index) {
              <div
                class="feature-item"
                scrollAnimation
                animationType="fadeInLeft"
                [animationDelay]="$index * 50"
              >
                <div class="item-indicator">
                  <div class="indicator-dot"></div>
                  <div class="indicator-pulse"></div>
                </div>
                <span class="item-text">{{ item }}</span>
                <div class="item-hover-effect"></div>
              </div>
              }
            </div>
          </div>
        </div>

      </div>
      }
    </div>
  </div>
</section>
