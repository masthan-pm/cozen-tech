<div class="welcome-container">
  <!-- Hero Section -->
  <section class="hero-section">
    <div class="hero-overlay gradient-overlay"></div>
    <div class="hero-content">
      <h1>
        {{ welcome.title.main }}<br />
        <span class="highlight">{{ welcome.title.sub }}</span>
      </h1>
      <p class="hero-description">
        {{ welcome.content }}
      </p>
      <div class="hero-buttons">
        <a routerLink="/solutions" class="btn btn-primary">
          {{ welcome.explore }}
          <i class="material-icons">arrow_forward</i>
        </a>
        <a routerLink="/contact" class="btn btn-secondary"
          >{{ welcome.contact }}
        </a>
      </div>
    </div>
  </section>

  <!-- Company Overview -->
  <section class="company-overview">
    <div class="container">
      <div class="content-grid">
        <div class="image-container">
          <div class="image-background"></div>
          <img
            [src]="about.image"
            alt="Team collaboration"
            class="main-image"
            loading="lazy"
          />
        </div>
        <div class="text-content">
          <h2>{{ about.header }}</h2>
          <p>{{ about.content.p1 }}</p>
          <p>{{ about.content.p2 }}</p>
          <a routerLink="/about" class="read-more">
            {{ about.linkText }}
            <i class="material-icons">arrow_forward</i>
          </a>
        </div>
      </div>
    </div>
  </section>

  <app-services></app-services>
  <app-clients></app-clients>
  <app-testimonials></app-testimonials>
  <app-cta
    [header]="cta.header"
    [text]="cta.text"
    [buttonText]="cta.buttonText"
    [showContactInfo]="true"
  ></app-cta>
</div>
