<div class="welcome-container">
  <!-- Hero Section -->
  <section class="hero-section">
    <div class="hero-overlay gradient-overlay"></div>
    <div class="hero-content">
      <h1>
        Empowering Businesses with<br />
        <span class="highlight">Cutting-Edge IT Solutions</span>
      </h1>
      <p class="hero-description">
        Partner with us to transform your business through innovative technology
        solutions and exceptional talent acquisition services.
      </p>
      <div class="hero-buttons">
        <a routerLink="/solutions" class="btn btn-primary">
          Explore Our Solutions
          <i class="material-icons">arrow_forward</i>
        </a>
        <a routerLink="/contact" class="btn btn-secondary"> Contact Us </a>
      </div>
    </div>
  </section>
  <app-company-overview></app-company-overview>
  <app-services></app-services>
  <app-clients></app-clients>
  <app-testimonials></app-testimonials>
  <app-cta
    [header]="cta.header"
    [text]="cta.text"
    [buttonText]="cta.buttonText"
    [showContactInfo]="true"
  ></app-cta>
