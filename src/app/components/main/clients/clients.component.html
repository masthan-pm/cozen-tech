<section class="clients-section" scrollAnimation animationType="fadeInUp">
  <div class="container">
    <div class="header" scrollReveal [revealDelay]="100">
      <h2>{{ header }}</h2>
      <p>{{ content }}</p>
    </div>

    <div class="clients-carousel-wrapper parallax-container" scrollAnimation animationType="slideInUp" [animationDelay]="300">
      <div class="clients-carousel" #carousel>
        <!-- Triple the clients array for seamless infinite scroll -->
        @for (client of tripleClients; track $index) {
        <div 
          class="client-card magnetic-element"
          [class.center-card]="isCenterCard($index)"
          [attr.data-index]="$index"
        >
          <img
            [src]="client.logo"
            [alt]="client.name"
            class="client-logo"
            loading="lazy"
          />
          <span class="sr-only">{{ client.name }}</span>
        </div>
        }
      </div>
    </div>
  </div>
</section>
