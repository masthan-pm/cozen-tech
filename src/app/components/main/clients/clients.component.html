<section class="clients-section">
  <div class="container">
    <div class="header">
      <h2>{{ header }}</h2>
      <p>{{ content }}</p>
    </div>

    <div class="clients-grid">
      @for (client of clients; track $index) {
      <div class="client-card">
        <img
          [src]="client.logo"
          [alt]="client.name"
          class="client-logo"
          loading="lazy"
        />
        <span class="sr-only">{{ client.name }}</span>
      </div>
      }
    </div>
  </div>
</section>
