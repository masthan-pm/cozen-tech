<section class="testimonials-section" scrollAnimation animationType="fadeInUp">
  <div class="container">
    <div class="header" scrollReveal [revealDelay]="100">
      <h2>{{ header }}</h2>
      <p>{{ content }}</p>
    </div>

    <div class="testimonials-grid stagger-animation">
      @for (testimonial of testimonials; track $index) {
      <div class="testimonial-card stagger-item scroll-enhanced-card" scrollAnimation animationType="fadeInUp" [animationDelay]="$index * 150">
        <div class="quote-icon">
          <i class="material-icons">format_quote</i>
        </div>
        <div class="profile">
          <img
            [src]="testimonial.image"
            [alt]="testimonial.name"
            class="profile-image"
            loading="lazy"
          />
          <div class="profile-info">
            <h3>{{ testimonial.name }}</h3>
            <p>{{ testimonial.position }}</p>
          </div>
        </div>
        <p class="quote">{{ testimonial.quote }}</p>
        <div class="stars">
          @for (star of stars; track $index) {
          <i class="material-icons">star</i>
          }
        </div>
      </div>
      }
    </div>
  </div>
</section>
