<section id="services" class="services-section">
  <div class="container">
    <div class="header">
      <h2>Our Services</h2>
      <p>
        Comprehensive technology solutions and services designed to drive your
        business forward and ensure lasting success in the digital age.
      </p>
    </div>

    <div class="services-grid">
      <div *ngFor="let service of services; let i = index" class="service-card">
        <div class="image-container">
          <img
            [src]="service.image"
            [alt]="service.title"
            class="service-image"
          />
          <div class="overlay">
            <i class="material-icons icon">{{ service.icon }}</i>
            <h3>{{ service.title }}</h3>
          </div>
        </div>
        <div class="card-content">
          <p>{{ service.description }}</p>
          <a [routerLink]="service.destinatedLink" class="learn-more">
            Read More
            <i class="material-icons">arrow_forward</i>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
