<section id="services" class="services-section">
  <div class="container">
    @if (showServicesHeader) {
    <div class="header">
      <h2>{{ header.title }}</h2>
      <p>{{ header.content }}</p>
    </div>
    }

    <div class="services-grid">
      @for (service of services; track $index) {
      <div class="service-card">
        <div class="image-container">
          <img
            [src]="service.image"
            [alt]="service.title"
            class="service-image"
            loading="lazy"
          />
          <div class="overlay">
            <i class="material-icons icon">{{ service.icon }}</i>
            <h3>{{ service.title }}</h3>
          </div>
        </div>
        <div class="card-content">
          <p>{{ service.description }}</p>
          <a [routerLink]="service.destinatedLink" class="learn-more">
            {{ header.linkText }}
            <i class="material-icons">arrow_forward</i>
          </a>
        </div>
      </div>
      }
    </div>
  </div>
</section>
