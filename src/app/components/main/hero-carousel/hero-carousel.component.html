<div class="hero-carousel"
  (mousemove)="onMouseMove($event)"
  (touchstart)="onTouchStart($event)"
  (touchend)="onTouchEnd($event)"
  role="region"
  aria-label="Hero image carousel">
  <div class="carousel-container"
    aria-live="polite">
    <ng-container *ngFor="let slide of slides; let i = index">
      <div
        *ngIf="i === currentSlideIndex"
        class="carousel-slide"
        @fadeAnimation
      >
        <div class="background-image" [ngStyle]="getBackgroundStyle(slide)"></div>
        <div class="hero-overlay" [class.gradient-overlay]="true"></div>

        <div class="hero-content">
          <h1 class="slide-title" @scaleAnimation>
            {{ slide.title }}<br />
            <span class="highlight">{{ slide.subtitle }}</span>
          </h1>
          <p class="hero-description" @slideUpAnimation>{{ slide.description }}</p>

          <div class="hero-buttons" @slideUpAnimation>
            <a [routerLink]="slide.cta?.link || '/solutions'" class="btn btn-primary">
              {{slide.cta?.text}}
              <i class="material-icons">arrow_forward</i>
            </a>
            <a routerLink="/contact" class="btn btn-secondary">
              Contact Us
            </a>
          </div>
        </div>
      </div>
    </ng-container>

    <!-- Navigation Arrows -->
    <div *ngIf="showArrows && slides.length > 1" class="carousel-arrows">
      <button
        class="arrow-btn prev"
        (click)="prevSlide()"
        aria-label="Previous slide"
      >
        <i class="material-icons">chevron_left</i>
      </button>
      <button
        class="arrow-btn next"
        (click)="nextSlide()"
        aria-label="Next slide"
      >
        <i class="material-icons">chevron_right</i>
      </button>
    </div>

    <!-- Carousel Indicators -->
    <div *ngIf="showIndicators && slides.length > 1" class="carousel-indicators">
      <button
        *ngFor="let slide of slides; let i = index"
        class="indicator"
        [class.active]="i === currentSlideIndex"
        (click)="goToSlide(i)"
      >
        <div *ngIf="showProgressBar" class="progress-container">
          <div #progressBars class="progress-bar"></div>
        </div>
      </button>
    </div>

    <!-- Slide Counter -->
    <div class="slide-counter">
      <span class="current">{{ currentSlideIndex + 1 }}</span>
      <span class="separator">/</span>
      <span class="total">{{ slides.length }}</span>
    </div>
  </div>
</div>
