<div class="about-page">
  <!-- Hero Section -->
  <app-hero
    [backgroundImage]="about.image"
    [header]="about.header"
    [text]="about.text"
  ></app-hero>

  <app-story></app-story>
  <app-mission-stats></app-mission-stats>
  <app-values></app-values>
  <app-choosing></app-choosing>
  <app-teams></app-teams>

  <!-- Company Culture Section -->
  <section class="culture-section" scrollAnimation animationType="fadeInUp">
    <div class="container">
      <div class="culture-content">
        <div class="culture-header" scrollReveal [revealDelay]="100">
          <div class="section-label">Our Culture</div>
          <h2>{{ culture.title }}</h2>
          <p>{{ culture.subtitle }}</p>
        </div>

        <div class="culture-grid stagger-animation" staggerAnimation>
          <div class="culture-card stagger-item scroll-enhanced-card"
               *ngFor="let item of culture.items; let i = index"
               scrollAnimation animationType="fadeInUp" [animationDelay]="i * 150">
            <div class="culture-image">
              <img [src]="item.image" [alt]="item.title" loading="lazy">
              <div class="image-overlay"></div>
            </div>
            <div class="culture-content-inner">
              <div class="culture-icon">
                <i class="material-icons">{{ item.icon }}</i>
              </div>
              <h3>{{ item.title }}</h3>
              <p>{{ item.description }}</p>
            </div>
            <div class="culture-glow"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <app-innovation></app-innovation>
  <app-awards></app-awards>
   <app-global-presence></app-global-presence>

  <!-- CTA Section -->
  <app-cta
    [header]="cta.header"
    [text]="cta.text"
    [buttonText]="cta.buttonText"
    [showContactInfo]="true"
  ></app-cta>
</div>
