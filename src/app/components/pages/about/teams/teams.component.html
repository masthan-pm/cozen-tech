<section class="teams-section">
  <div class="container">
    <div class="header">
      <h2>Our Leadership Team</h2>
      <p>
        Meet the experienced professionals who guide our company's vision and
        success through innovation, expertise, and dedication.
      </p>
    </div>

    <div class="team-grid">
      <div *ngFor="let member of team" class="team-card">
        <div class="image-container">
          <img
            [src]="member.image"
            [alt]="member.name"
            class="member-image"
            loading="lazy"
          />
          <div class="overlay">
            <div class="social-links">
              <a
                [href]="member.linkedin"
                target="_blank"
                rel="noopener noreferrer"
                class="social-link"
              >
                <i class="material-icons">link</i>
              </a>
              <a [href]="'mailto:' + member.email" class="social-link">
                <i class="material-icons">mail</i>
              </a>
            </div>
          </div>
        </div>
        <div class="content">
          <h3>{{ member.name }}</h3>
          <p class="role">{{ member.role }}</p>
          <p class="bio">{{ member.bio }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
