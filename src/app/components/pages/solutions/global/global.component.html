<div class="global-solutions">
  <!-- Animated Hero Section -->
  <app-animated-hero
    [title]="'Global Technology Solutions'"
    [subtitle]="'GLOBAL TECHNOLOGY'"
    [description]="'End-to-end software development and IT consulting services tailored to your business needs'"
    [primaryButtonText]="'Get Consultation'"
    [secondaryButtonText]="'Our Services'"
    [secondaryButtonLink]="'#services'"
    [stats]="heroStats"
    [animatedIcons]="heroIcons"
    [gradientColors]="['#667eea', '#764ba2', '#4facfe']"
  ></app-animated-hero>

  <!-- Services Section -->
  <section id="services">
    <app-assistance
      [header]="assistance.header"
      [subheader]="assistance.subheader"
      [services]="services"
    ></app-assistance>
  </section>

  <!-- Interactive Process Section -->
  <app-interactive-process
    [header]="process.header"
    [subheader]="process.subheader"
    [steps]="processSteps"
    [autoProgress]="true"
  ></app-interactive-process>

  <!-- Technology Showcase -->
  <app-tech-showcase
    [header]="technologiesSection.header"
    [subheader]="technologiesSection.subheader"
    [categories]="techCategories"
  ></app-tech-showcase>

  <!-- Solution-specific CTA -->
  <app-solution-cta
    [header]="cta.header"
    [text]="cta.text"
    [primaryButtonText]="'Start Your Project'"
    [secondaryButtonText]="'Schedule Consultation'"
    [solutionType]="'global'"
    [showContactInfo]="true"
  ></app-solution-cta>
</div>
