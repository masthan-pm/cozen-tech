<div class="global-solutions">
  <!-- Hero Section -->
  <app-hero
    [backgroundImage]="global.image"
    [header]="global.header"
    [text]="global.text"
  >
  </app-hero>

  <!-- Services Section -->
  <section class="services-section">
    <div class="container">
      <div class="header">
        <h2>Our Services</h2>
        <p>
          We offer a wide range of technology solutions to help businesses
          thrive in the digital age.
        </p>
      </div>

      <div class="services-grid">
        <div *ngFor="let service of services" class="service-card">
          <div class="card-content">
            <div class="title-wrapper">
              <i class="material-icons">{{ service.icon }}</i>
              <h3>{{ service.title }}</h3>
            </div>
            <p>{{ service.description }}</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Process Section -->
  <app-process
    [header]="process.header"
    [subheader]="process.subheader"
    [phases]="phases"
  ></app-process>

  <!-- Technologies Section -->
  <section class="technologies-section">
    <div class="container">
      <div class="header">
        <h2>Technologies We Use</h2>
        <p>
          We leverage the latest technologies to build robust and scalable
          solutions.
        </p>
      </div>

      <div class="tech-grid">
        <div *ngFor="let tech of technologies" class="tech-card">
          <span>{{ tech }}</span>
        </div>
      </div>
    </div>
  </section>

  <!-- CTA Section -->
  <app-cta [header]="cta.header" [text]="cta.text"></app-cta>
</div>
