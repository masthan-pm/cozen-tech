<div class="global-solutions">
  <app-hero
    variant="enhanced"
    [header]="global.header"
    [text]="global.text"
    [floatingIcons]="floatingIcons"
    [heroStats]="heroStats"
    primaryColor="#667eea"
    [heroAction]="heroAction"
  ></app-hero>

  <app-assistance
    [header]="assistance.header"
    [subheader]="assistance.subheader"
    [services]="services"
    badgeIcon="build"
    badgeText="Our Services"
  ></app-assistance>

  <app-process
    [process]="process"
    [phases]="phases"
    [stepFeatures]="stepFeatures"
  ></app-process>

  <app-tech [technologies]="technologies" [technologiesSection]="technologiesSection"></app-tech>

  <app-solution-cta
    [header]="cta.header"
    [text]="cta.text"
    buttonText="Start Your Project"
    buttonIcon="rocket_launch"
    centralIcon="public"
    badgeIcon="build"
    badgeText="Solutions"
    [floatingIcons]="['code', 'cloud', 'security', 'integration_instructions', 'language', 'devices']"
  ></app-solution-cta>
</div>
