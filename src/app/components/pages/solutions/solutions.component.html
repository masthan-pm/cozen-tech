<div class="solutions-page">
  <!-- Hero Section -->
  <section class="hero-section">
    <div class="overlay"></div>
    <div class="container">
      <h1>Our Solutions</h1>
      <p>
        Comprehensive technology solutions tailored to drive your business
        forward
      </p>
    </div>
  </section>

  <!-- Solutions Grid -->
  <section class="solutions-section">
    <div class="container">
      <div class="solutions-grid">
        <div *ngFor="let solution of solutions" class="solution-card">
          <div class="card-content">
            <div class="header">
              <i class="material-icons">{{ solution.icon }}</i>
              <h3>{{ solution.title }}</h3>
            </div>
            <p class="description">{{ solution.description }}</p>
            <ul class="features">
              <li *ngFor="let feature of solution.features">
                <span class="bullet"></span>
                {{ feature }}
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- CTA Section -->
  <app-cta [header]="cta.header" [text]="cta.text"></app-cta>
</div>
