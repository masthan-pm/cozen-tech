<div class="finance-solutions">
  <!-- Hero Section -->
  <app-hero
    [backgroundImage]="finance.image"
    [header]="finance.header"
    [text]="finance.text"
  >
  </app-hero>

  <!-- Services Section -->
  <app-assistance
    [header]="assistance.header"
    [subheader]="assistance.subheader"
    [services]="services"
  ></app-assistance>

  <!-- Benefits Section -->
  <section class="benefits-section">
    <div class="container">
      <div class="header">
        <h2>Why Choose Our Financial Services</h2>
        <p>
          Experience the benefits of working with a trusted financial partner.
        </p>
      </div>

      <div class="benefits-grid">
        <div *ngFor="let benefit of benefits" class="benefit-card">
          <h3>{{ benefit.title }}</h3>
          <p>{{ benefit.description }}</p>
        </div>
      </div>
    </div>
  </section>

  <!-- Expertise Section -->
  <app-features
    [header]="features.header"
    [subheader]="features.subheader"
    [features]="expertise"
  ></app-features>

  <!-- CTA Section -->
  <app-cta [header]="cta.header" [text]="cta.text"></app-cta>
</div>
