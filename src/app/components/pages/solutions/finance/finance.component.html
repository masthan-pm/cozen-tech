<div class="finance-solutions">
  <!-- Hero Section -->
  <app-hero
    [backgroundImage]="finance.image"
    [header]="finance.header"
    [text]="finance.text"
  >
  </app-hero>

  <!-- Services Section -->
  <app-assistance
    [header]="assistance.header"
    [subheader]="assistance.subheader"
    [services]="services"
  ></app-assistance>

  <!-- Benefits Section -->
  <section class="benefits-section">
    <div class="container">
      <div class="header">
        <h2>Why Choose Our Financial Services</h2>
        <p>
          Experience the benefits of working with a trusted financial partner.
        </p>
      </div>

      <div class="benefits-grid">
        <div *ngFor="let benefit of benefits" class="benefit-card">
          <h3>{{ benefit.title }}</h3>
          <p>{{ benefit.description }}</p>
        </div>
      </div>
    </div>
  </section>

  <!-- Expertise Section -->
  <section class="expertise-section">
    <div class="container">
      <div class="header">
        <h2>Areas of Expertise</h2>
        <p>Comprehensive financial expertise across various domains.</p>
      </div>

      <div class="features-grid">
        <div *ngFor="let area of expertise" class="feature-card">
          <h3>{{ area.category }}</h3>
          <ul>
            <li *ngFor="let item of area.items">
              <span class="bullet"></span>
              {{ item }}
            </li>
          </ul>
        </div>
      </div>
    </div>
  </section>

  <!-- CTA Section -->
  <app-cta [header]="cta.header" [text]="cta.text"></app-cta>
</div>
