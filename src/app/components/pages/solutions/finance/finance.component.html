<div class="finance-solutions">
  <app-hero
    variant="enhanced"
    [header]="finance.header"
    [text]="finance.text"
    [floatingIcons]="floatingIcons"
    [heroStats]="heroStats"
    primaryColor="#00b2b2"
    [heroAction]="heroAction"
  ></app-hero>

  <app-assistance
    [header]="assistance.header"
    [subheader]="assistance.subheader"
    [services]="services"
    badgeIcon="business_center"
    badgeText="Our Services"
  ></app-assistance>

  <!-- Benefits Showcase -->
  <section class="benefits-section" scrollAnimation animationType="fadeInUp">
    <div class="container">
      <div class="section-header" scrollReveal [revealDelay]="100">
        <div class="section-badge">
          <i class="material-icons">star</i>
          <span>Benefits</span>
        </div>
        <h2>{{ benefitsHeading.title }}</h2>
        <p>{{ benefitsHeading.content }}</p>
      </div>

      <div class="benefits-interactive-grid stagger-animation" staggerAnimation>
        <div
          *ngFor="let benefit of benefits; let i = index"
          class="benefit-card-enhanced stagger-item"
          scrollAnimation
          animationType="scaleIn"
          [animationDelay]="i * 200"
          (mouseenter)="onBenefitHover(i, true)"
          (mouseleave)="onBenefitHover(i, false)"
          [class.hovered]="hoveredBenefit === i"
        >
          <div class="card-glow"></div>

          <div class="benefit-visual">
            <div class="benefit-icon">
              <i class="material-icons">{{ getBenefitIcon(i) }}</i>
            </div>

            <div class="benefit-preview">
              <div class="benefit-title">{{ benefit.title }}</div>
              <div class="benefit-description">{{ benefit.description }}</div>
            </div>
          </div>

          <div class="benefit-content">
            <h3>{{ benefit.title }}</h3>
            <p>{{ benefit.description }}</p>

            <div class="benefit-features">
              <div class="feature-tag" *ngFor="let feature of getBenefitFeatures(i)">
                {{ feature }}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <app-features
    [header]="features.header"
    [subheader]="features.subheader"
    [features]="expertise"
  ></app-features>

  <app-solution-cta
    [header]="cta.header"
    [text]="cta.text"
    buttonText="Start Financial Journey"
    buttonIcon="trending_up"
    centralIcon="attach_money"
    badgeIcon="account_balance"
    badgeText="Finance"
    [floatingIcons]="['analytics', 'pie_chart', 'calculate', 'fact_check', 'trending_up', 'euro_symbol']"
  ></app-solution-cta>
</div>
