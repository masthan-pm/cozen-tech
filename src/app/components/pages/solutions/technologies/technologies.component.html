<div class="technologies-solutions">
  <app-hero
    variant="enhanced"
    [header]="technologies.header"
    [text]="technologies.text"
    [floatingIcons]="floatingIcons"
    [heroStats]="heroStats"
    primaryColor="#8b5cf6"
    [heroAction]="heroAction"
  ></app-hero>

  <app-assistance
    [header]="assistance.header"
    [subheader]="assistance.subheader"
    [services]="services"
  ></app-assistance>

  <!-- Neural Tech Stack Visualization -->
  <section class="neural-tech-section" scrollAnimation animationType="fadeInUp">
    <div class="container">
      <div class="section-header" scrollReveal [revealDelay]="100">
        <div class="section-badge">
          <i class="material-icons">memory</i>
          <span>Tech Stack</span>
        </div>
        <h2>{{ techStackSection.header }}</h2>
        <p>{{ techStackSection.subheader }}</p>
      </div>

      <div class="neural-network-container" scrollAnimation animationType="scaleIn" [animationDelay]="300">
        <!-- Central Brain/Core -->
        <div class="neural-core">
          <div class="core-brain">
            <i class="material-icons">psychology</i>
          </div>
        </div>

        <!-- Tech Category Clusters -->
        <div class="tech-clusters">
          @for (stack of techStack; track $index) {
          <div class="tech-cluster"
               [class]="'cluster-' + ($index + 1)"
               scrollAnimation animationType="fadeInUp" [animationDelay]="$index * 200 + 500">

            <!-- Cluster Hub -->
            <div class="cluster-hub">
              <div class="hub-icon">
                <i class="material-icons">{{ stack.icon }}</i>
              </div>
              <div class="hub-label">{{ stack.category }}</div>
              <div class="hub-glow"></div>
            </div>

            <!-- Tech Nodes orbiting around the hub -->
            <div class="tech-nodes">
              @for (tech of stack.items; track $index) {
              <div class="tech-node"
                   [style.--orbit-delay]="$index * 0.5 + 's'"
                   [style.--orbit-radius]="80 + ($index % 2) * 20 + 'px'"
                   [style.--orbit-angle]="(360 / stack.items.length) * $index + 'deg'">
                <div class="node-content">
                  <span class="tech-name">{{ tech }}</span>
                  <div class="node-pulse"></div>
                </div>
              </div>
              }
            </div>
          </div>
          }
        </div>
      </div>
    </div>
  </section>

  <app-features
    [header]="features.header"
    [subheader]="features.subheader"
    [features]="featuresContent"
  ></app-features>

  <app-solution-cta
    [header]="cta.header"
    [text]="cta.text"
    buttonText="Explore Technologies"
    buttonIcon="rocket_launch"
    centralIcon="code"
    badgeIcon="memory"
    badgeText="Technologies"
    [floatingIcons]="['cloud', 'security', 'analytics', 'integration_instructions', 'wifi', 'psychology']"
  ></app-solution-cta>
</div>
