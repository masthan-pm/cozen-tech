<div class="technologies-solutions">
  <app-hero
    variant="enhanced"
    [header]="technologies.header"
    [text]="technologies.text"
    [floatingIcons]="floatingIcons"
    [heroStats]="heroStats"
    primaryColor="#8b5cf6"
    [heroAction]="heroAction"
  ></app-hero>

  <app-assistance
    [header]="assistance.header"
    [subheader]="assistance.subheader"
    [services]="services"
  ></app-assistance>

  <section class="tech-stack-section">
    <div class="container">
      <div class="header">
        <h2>{{ techStackSection.header }}</h2>
        <p>{{ techStackSection.subheader }}</p>
      </div>

      <div class="features-grid">
        <div *ngFor="let stack of techStack" class="feature-card">
          <h3>{{ stack.category }}</h3>
          <ul>
            <li *ngFor="let tech of stack.items">
              <span class="bullet"></span>
              {{ tech }}
            </li>
          </ul>
        </div>
      </div>
    </div>
  </section>

  <app-features
    [header]="features.header"
    [subheader]="features.subheader"
    [features]="featuresContent"
  ></app-features>

  <app-solution-cta
    [header]="cta.header"
    [text]="cta.text"
    buttonText="Explore Technologies"
    buttonIcon="rocket_launch"
    centralIcon="code"
    badgeIcon="memory"
    badgeText="Technologies"
    [floatingIcons]="['cloud', 'security', 'analytics', 'integration_instructions', 'wifi', 'psychology']"
  ></app-solution-cta>
</div>
