<div class="technologies-solutions">
  <!-- Hero Section -->
  <app-hero
    [backgroundImage]="technologies.image"
    [header]="technologies.header"
    [text]="technologies.text"
  >
  </app-hero>

  <!-- Services Section -->
  <app-assistance
    [header]="assistance.header"
    [subheader]="assistance.subheader"
    [services]="services"
  ></app-assistance>

  <!-- Tech Stack Section -->
  <section class="tech-stack-section">
    <div class="container">
      <div class="header">
        <h2>Our Tech Stack</h2>
        <p>
          Modern technologies we use to build robust and scalable solutions.
        </p>
      </div>

      <div class="features-grid">
        <div *ngFor="let stack of techStack" class="feature-card">
          <h3>{{ stack.category }}</h3>
          <ul>
            <li *ngFor="let tech of stack.items">
              <span class="bullet"></span>
              {{ tech }}
            </li>
          </ul>
        </div>
      </div>
    </div>
  </section>

  <!-- Features Section -->
  <app-features
    [header]="features.header"
    [subheader]="features.subheader"
    [features]="featuresContent"
  ></app-features>

  <!-- CTA Section -->
  <app-cta [header]="cta.header" [text]="cta.text"></app-cta>
</div>
