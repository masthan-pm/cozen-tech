<div class="staffing-solutions">
  <!-- Hero Section -->
  <app-hero
    [backgroundImage]="staffing.image"
    [header]="staffing.header"
    [text]="staffing.text"
  >
  </app-hero>

  <!-- Services Section -->
  <section class="services-section">
    <div class="container">
      <div class="header">
        <h2>Our Recruitment Services</h2>
        <p>
          Comprehensive staffing solutions tailored to meet your technical
          talent needs.
        </p>
      </div>

      <div class="services-grid">
        <div *ngFor="let service of services" class="service-card">
          <div class="card-content">
            <div class="title-wrapper">
              <i class="material-icons">{{ service.icon }}</i>
              <h3>{{ service.title }}</h3>
            </div>
            <p>{{ service.description }}</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Process Section -->
  <app-process
    [header]="process.header"
    [subheader]="process.subheader"
    [phases]="phases"
  ></app-process>

  <!-- Specializations Section -->
  <section class="specializations-section">
    <div class="container">
      <div class="header">
        <h2>Our Specializations</h2>
        <p>
          We specialize in recruiting for various technical domains and roles.
        </p>
      </div>

      <div class="tech-grid">
        <div *ngFor="let specialization of specializations" class="tech-card">
          <span>{{ specialization }}</span>
        </div>
      </div>
    </div>
  </section>

  <!-- CTA Section -->
  <app-cta [header]="cta.header" [text]="cta.text"></app-cta>
</div>
