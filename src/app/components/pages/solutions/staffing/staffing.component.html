<div class="staffing-solutions">
  <app-hero
    variant="enhanced"
    [header]="staffing.header"
    [text]="staffing.text"
    [floatingIcons]="floatingIcons"
    [heroStats]="heroStats"
    primaryColor="#667eea"
    accentColor="#4facfe"
    [heroAction]="heroAction"
  ></app-hero>

  <app-assistance
    [header]="assistance.header"
    [subheader]="assistance.subheader"
    [services]="services"
    badgeIcon="work"
    badgeText="Our Services"
  ></app-assistance>

  <app-process
    [process]="process"
    [phases]="phases"
    [stepFeatures]="stepFeatures"
  ></app-process>
  <!-- Specializations Showcase -->
  <section class="specializations-section" scrollAnimation animationType="fadeInUp">
    <div class="container">
      <div class="section-header" scrollReveal [revealDelay]="100">
        <div class="section-badge">
          <i class="material-icons">psychology</i>
          <span>Specializations</span>
        </div>
        <h2>{{ specializationsSection.header }}</h2>
        <p>{{ specializationsSection.subheader }}</p>
      </div>

      <div class="specializations-grid">
        <div
          *ngFor="let specialization of specializations; let i = index"
          class="specialization-card"
          scrollAnimation
          animationType="scaleIn"
          [animationDelay]="i * 100"
          (mouseenter)="onSpecializationHover(i, true)"
          (mouseleave)="onSpecializationHover(i, false)"
          [class.hovered]="hoveredSpecialization === i"
        >
          <div class="card-glow"></div>

          <div class="specialization-icon">
            <i class="material-icons">{{ getSpecializationIcon(i) }}</i>
            <div class="icon-particles">
              <div class="particle" *ngFor="let p of [1,2,3,4,5]"></div>
            </div>
          </div>

          <h3>{{ specialization }}</h3>

          <div class="demand-indicator">
            <div class="demand-bar">
              <div class="demand-fill" [style.width]="getSpecializationDemand(i) + '%'"></div>
            </div>
            <span class="demand-text">{{ getSpecializationDemand(i) }}% Demand</span>
          </div>

          <div class="specialization-stats">
            <div class="stat-item">
              <i class="material-icons">trending_up</i>
              <span>High Growth</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <app-solution-cta
    [header]="cta.header"
    [text]="cta.text"
    buttonText="Find Top Talent"
    buttonIcon="search"
    centralIcon="groups"
    badgeIcon="work"
    badgeText="Staffing"
    [floatingIcons]="['person', 'business', 'handshake', 'star', 'check_circle', 'trending_up']"
  ></app-solution-cta>
</div>
