<div class="hr-payroll-solutions">
  <!-- Hero Section -->
  <app-hero
    [backgroundImage]="hrPayroll.image"
    [header]="hrPayroll.header"
    [text]="hrPayroll.text"
  >
  </app-hero>

  <!-- Services Section -->
  <app-assistance
    [header]="assistance.header"
    [subheader]="assistance.subheader"
    [services]="services"
  ></app-assistance>

  <!-- Process Section -->
  <app-process
    [header]="process.header"
    [subheader]="process.subheader"
    [phases]="phases"
  ></app-process>

  <!-- Features Section -->
  <app-features
    [header]="features.header"
    [subheader]="features.subheader"
    [features]="featuresContent"
  ></app-features>

  <!-- CTA Section -->
  <app-cta [header]="cta.header" [text]="cta.text"></app-cta>
</div>
