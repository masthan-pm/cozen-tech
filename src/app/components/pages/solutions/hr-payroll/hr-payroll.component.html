<div class="hr-payroll-solutions">
  <app-hero
    variant="enhanced"
    [header]="hrPayroll.header"
    [text]="hrPayroll.text"
    [floatingIcons]="floatingIcons"
    [heroStats]="heroStats"
    primaryColor="#4facfe"
    [heroAction]="heroAction"
  ></app-hero>

  <app-assistance
    [header]="assistance.header"
    [subheader]="assistance.subheader"
    [services]="services"
    badgeIcon="business_center"
    badgeText="Our Services"
  ></app-assistance>

  <app-process
    [process]="process"
    [phases]="phases"
    [stepFeatures]="stepFeatures"
  ></app-process>

  <app-features
    [header]="features.header"
    [subheader]="features.subheader"
    [features]="featuresContent"
  ></app-features>

  <app-solution-cta
    [header]="cta.header"
    [text]="cta.text"
    buttonText="Transform HR Operations"
    buttonIcon="rocket_launch"
    centralIcon="groups"
    badgeIcon="business_center"
    badgeText="HR Solutions"
    [floatingIcons]="['person', 'attach_money', 'schedule', 'security', 'favorite', 'verified']"
  ></app-solution-cta>
</div>
