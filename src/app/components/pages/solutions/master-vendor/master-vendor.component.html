<div class="master-vendor">
  <app-hero
    variant="enhanced"
    [header]="masterVendor.header"
    [text]="masterVendor.text"
    [floatingIcons]="floatingIcons"
    [heroStats]="heroStats"
    primaryColor="#f59e0b"
    [heroAction]="heroAction"
  ></app-hero>

  <app-assistance
    [header]="assistance.header"
    [subheader]="assistance.subheader"
    [services]="services"
  ></app-assistance>

  <app-process
    [process]="process"
    [phases]="phases"
    [stepFeatures]="stepFeatures"
  ></app-process>

  <app-features
    [header]="features.header"
    [subheader]="features.subheader"
    [features]="benefits"
  ></app-features>

  <app-solution-cta
    [header]="cta.header"
    [text]="cta.text"
    buttonText="Optimize Vendor Management"
    buttonIcon="handshake"
    centralIcon="work"
    badgeIcon="business_center"
    badgeText="Vendor Solutions"
    [floatingIcons]="['group', 'trending_up', 'security', 'settings', 'analytics', 'verified']"
  ></app-solution-cta>
</div>
