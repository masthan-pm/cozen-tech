<div class="master-vendor">
  <!-- Hero Section -->
  <app-hero
    [backgroundImage]="masterVendor.image"
    [header]="masterVendor.header"
    [text]="masterVendor.text"
  >
  </app-hero>

  <!-- Services Section -->
  <section class="services-section">
    <div class="container">
      <div class="header">
        <h2>Our Vendor Management Services</h2>
        <p>
          Comprehensive vendor management solutions to optimize your business
          operations.
        </p>
      </div>

      <div class="services-grid">
        <div *ngFor="let service of services" class="service-card">
          <div class="card-content">
            <div class="title-wrapper">
              <i class="material-icons">{{ service.icon }}</i>
              <h3>{{ service.title }}</h3>
            </div>
            <p>{{ service.description }}</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Process Section -->
  <app-process
    [header]="process.header"
    [subheader]="process.subheader"
    [phases]="phases"
  ></app-process>

  <!-- Benefits Section -->
  <section class="benefits-section">
    <div class="container">
      <div class="header">
        <h2>Program Benefits</h2>
        <p>Key advantages of our master vendor program.</p>
      </div>

      <div class="benefits-grid">
        <div *ngFor="let benefit of benefits" class="benefit-card">
          <h3>{{ benefit.category }}</h3>
          <ul>
            <li *ngFor="let item of benefit.items">
              <span class="bullet"></span>
              {{ item }}
            </li>
          </ul>
        </div>
      </div>
    </div>
  </section>

  <!-- CTA Section -->
  <app-cta [header]="cta.header" [text]="cta.text"></app-cta>
</div>
