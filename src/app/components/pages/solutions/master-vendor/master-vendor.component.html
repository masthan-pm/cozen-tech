<div class="master-vendor">
  <app-hero
    variant="enhanced"
    [header]="masterVendor.header"
    [text]="masterVendor.text"
    [floatingIcons]="floatingIcons"
    [heroStats]="heroStats"
    primaryColor="#f59e0b"
    accentColor="#d97706"
  ></app-hero>

  <app-assistance
    [header]="assistance.header"
    [subheader]="assistance.subheader"
    [services]="services"
  ></app-assistance>

  <app-process
    [process]="process"
    [phases]="phases"
    [stepFeatures]="stepFeatures"
  ></app-process>

  <app-features
    [header]="features.header"
    [subheader]="features.subheader"
    [features]="benefits"
  ></app-features>

  <app-cta [header]="cta.header" [text]="cta.text"></app-cta>
</div>
