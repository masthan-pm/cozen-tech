<div class="data-support-solutions">
  <app-hero
    variant="enhanced"
    [header]="dataSupport.header"
    [text]="dataSupport.text"
    [floatingIcons]="floatingIcons"
    [heroStats]="heroStats"
    primaryColor="#00b2b2"
    [heroAction]="heroAction"
  ></app-hero>
  <app-assistance
    [header]="assistance.header"
    [subheader]="assistance.subheader"
    [services]="services"
  ></app-assistance>

  <app-process
    [process]="process"
    [phases]="phases"
    [stepFeatures]="stepFeatures"
  ></app-process>

  <app-features
    [header]="features.header"
    [subheader]="features.subheader"
    [features]="capabilities"
  ></app-features>

  <app-solution-cta
    [header]="cta.header"
    [text]="cta.text"
    buttonText="Unlock Data Insights"
    buttonIcon="insights"
    centralIcon="storage"
    badgeIcon="analytics"
    badgeText="Data Solutions"
    [floatingIcons]="['analytics', 'bar_chart', 'search', 'security', 'share', 'cloud']"
  ></app-solution-cta>
</div>
