<div class="data-support-solutions">
  <app-hero
    [backgroundImage]="dataSupport.image"
    [header]="dataSupport.header"
    [text]="dataSupport.text"
  >
  </app-hero>
  <!-- Services Section -->
  <section class="services-section">
    <div class="container">
      <div class="header">
        <h2>Our Data Services</h2>
        <p>
          Comprehensive data solutions to help you make informed business
          decisions.
        </p>
      </div>

      <div class="services-grid">
        <div *ngFor="let service of services" class="service-card">
          <div class="card-content">
            <div class="title-wrapper">
              <i class="material-icons">{{ service.icon }}</i>
              <h3>{{ service.title }}</h3>
            </div>
            <p>{{ service.description }}</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Process Section -->
  <app-process
    [header]="process.header"
    [subheader]="process.subheader"
    [phases]="phases"
  ></app-process>

  <!-- Capabilities Section -->
  <section class="capabilities-section">
    <div class="container">
      <div class="header">
        <h2>Our Capabilities</h2>
        <p>
          Comprehensive data management capabilities across various domains.
        </p>
      </div>

      <div class="features-grid">
        <div *ngFor="let capability of capabilities" class="feature-card">
          <h3>{{ capability.category }}</h3>
          <ul>
            <li *ngFor="let item of capability.items">
              <span class="bullet"></span>
              {{ item }}
            </li>
          </ul>
        </div>
      </div>
    </div>
  </section>

  <!-- CTA Section -->
  <app-cta [header]="cta.header" [text]="cta.text"></app-cta>
</div>
