<div class="mortgage-solutions">
  <!-- Hero Section -->
  <app-hero
    [backgroundImage]="mortgage.image"
    [header]="mortgage.header"
    [text]="mortgage.text"
  >
  </app-hero>

  <!-- Services Section -->
  <app-assistance
    [header]="assistance.header"
    [subheader]="assistance.subheader"
    [services]="services"
  ></app-assistance>

  <!-- Process Section -->
  <app-process
    [header]="process.header"
    [subheader]="process.subheader"
    [phases]="phases"
  ></app-process>

  <!-- Features Section -->
  <section class="features-section">
    <div class="container">
      <div class="header">
        <h2>Service Features</h2>
        <p>
          Comprehensive mortgage processing features to ensure efficiency and
          accuracy.
        </p>
      </div>

      <div class="features-grid">
        <div *ngFor="let feature of features" class="feature-card">
          <h3>{{ feature.category }}</h3>
          <ul>
            <li *ngFor="let item of feature.items">
              <span class="bullet"></span>
              {{ item }}
            </li>
          </ul>
        </div>
      </div>
    </div>
  </section>

  <!-- CTA Section -->
  <app-cta [header]="cta.header" [text]="cta.text"></app-cta>
</div>
