<div class="mortgage-solutions">
  <app-hero
    variant="enhanced"
    [header]="mortgage.header"
    [text]="mortgage.text"
    [floatingIcons]="floatingIcons"
    [heroStats]="heroStats"
    primaryColor="#8b5cf6"
    [heroAction]="heroAction"
  ></app-hero>

  <app-assistance
    [header]="assistance.header"
    [subheader]="assistance.subheader"
    [services]="services"
  ></app-assistance>

  <app-process
    [process]="process"
    [phases]="phases"
    [stepFeatures]="stepFeatures"
  ></app-process>

  <app-features
    [header]="features.header"
    [subheader]="features.subheader"
    [features]="featuresContent"
  ></app-features>

  <app-cta [header]="cta.header" [text]="cta.text"></app-cta>
</div>
