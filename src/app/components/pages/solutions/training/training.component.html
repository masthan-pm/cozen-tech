<div class="training-solutions">
  <app-hero
    variant="enhanced"
    [header]="training.header"
    [text]="training.text"
    [floatingIcons]="floatingIcons"
    [heroStats]="heroStats"
    primaryColor="#06b6d4"
    accentColor="#0891b2"
  ></app-hero>

  <app-assistance
    [header]="assistance.header"
    [subheader]="assistance.subheader"
    [services]="services"
  ></app-assistance>

  <app-process
    [process]="process"
    [phases]="phases"
    [stepFeatures]="stepFeatures"
  ></app-process>

  <app-features
    [header]="features.header"
    [subheader]="features.subheader"
    [features]="featuresContent"
  ></app-features>

  <section class="technologies-section">
    <div class="container">
      <div class="header">
        <h2>{{ technologiesSection.header }}</h2>
        <p>{{ technologiesSection.subheader }}</p>
      </div>

      <div class="tech-grid">
        <div *ngFor="let tech of technologies" class="tech-card">
          <span>{{ tech }}</span>
        </div>
      </div>
    </div>
  </section>

  <app-cta [header]="cta.header" [text]="cta.text"></app-cta>
</div>
