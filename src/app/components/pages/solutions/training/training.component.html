<div class="training-solutions">
  <app-hero
    variant="enhanced"
    [header]="training.header"
    [text]="training.text"
    [floatingIcons]="floatingIcons"
    [heroStats]="heroStats"
    primaryColor="#00b2b2"
    [heroAction]="heroAction"
  ></app-hero>

  <app-assistance
    [header]="assistance.header"
    [subheader]="assistance.subheader"
    [services]="services"
  ></app-assistance>

  <app-process
    [process]="process"
    [phases]="phases"
    [stepFeatures]="stepFeatures"
  ></app-process>

  <app-features
    [header]="features.header"
    [subheader]="features.subheader"
    [features]="featuresContent"
  ></app-features>

  <app-tech [technologies]="technologies" [technologiesSection]="technologiesSection"></app-tech>

  <app-solution-cta
    [header]="cta.header"
    [text]="cta.text"
    buttonText="Start Learning Journey"
    buttonIcon="school"
    centralIcon="school"
    badgeIcon="emoji_events"
    badgeText="Training"
    [floatingIcons]="['menu_book', 'computer', 'track_changes', 'military_tech', 'psychology', 'trending_up']"
  ></app-solution-cta>
</div>
