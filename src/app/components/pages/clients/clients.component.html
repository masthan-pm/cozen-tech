<div class="clients-page">
  <!-- Hero Section -->
  <app-hero
    [backgroundImage]="clientsHero.image"
    [header]="clientsHero.header"
    [text]="clientsHero.text"
  >
  </app-hero>

  <!-- Client Logos Section -->
  <app-clients
    [header]="trustedBy.header"
    [content]="trustedBy.text"
  ></app-clients>

  <!-- Testimonials Section -->
  <app-testimonials
    [header]="testimonials.header"
    [content]="testimonials.content"
  ></app-testimonials>

  <!-- Success Stories Section -->
  <section class="success-stories-section">
    <div class="container">
      <div class="header">
        <h2>Success Stories</h2>
        <p>Real results from our partnerships with leading companies.</p>
      </div>

      <div class="stories-grid">
        <div *ngFor="let story of successStories" class="story-card">
          <img [src]="story.image" [alt]="story.title" class="story-image" />
          <div class="card-content">
            <h3>{{ story.title }}</h3>
            <p>{{ story.description }}</p>
            <ul class="results-list">
              <li *ngFor="let result of story.results">
                <span class="bullet"></span>
                {{ result }}
              </li>
            </ul>
            <a routerLink="/contact" class="read-more">
              Read Full Story
              <i class="material-icons">arrow_forward</i>
            </a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- CTA Section -->
  <app-cta
    [header]="cta.header"
    [text]="cta.text"
    [buttonText]="cta.buttonText"
  ></app-cta>
</div>
